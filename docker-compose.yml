services:
  db:
    image: postgres:16
    container_name: user-access-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: user_access_db
      POSTGRES_USER: user_access_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: .
    container_name: user-access-backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg://user_access_app:${POSTGRES_PASSWORD}@db:5432/user_access_db
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8000:8000"

volumes:
  postgres_data: